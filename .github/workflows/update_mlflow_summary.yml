name: Update MLflow Summary

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if MLflow database changed
        id: db_changed
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "^artifacts/mlflow.db$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.db_changed.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.db_changed.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate training summary
        if: steps.db_changed.outputs.changed == 'true'
        run: |
          python -m src.utils.mlflow_summary

      - name: Commit updated summary
        if: steps.db_changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artifacts/training_summary.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto update training summary"
            git push
          fi
